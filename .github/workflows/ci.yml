name: CI

# Typecheck, lint, test and build on every push/PR to main. Independent of
# the Vercel git-linked deploy (which builds separately) and needs no secrets
# — the ANTHROPIC_API_KEY is only for the ingestion agent, not for CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
